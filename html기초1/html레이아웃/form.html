<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <form> 
    <h4>type="text"는 문자 숫자 특수문자 입력가능</h4>
    <input type="text" name="id" id="id"> <br>
    
    <h4>type="password"는 비밀번호 입력시 사용 모든텍스트가 점으로 표현</h4>
    <input type="password" name="pw" id="pw"> <br>
    
    <h4>type="nuber"는 숫자만 입력가능 min,max,step 설정가능</h4>
    <input type="number" name="age" id="age" min="1" max="20" step="3"> <br>

    <h4>type="email"는 이메일형식을 감지 할수 있는 타입</h4>
    <input type="email"  name="email" id="email" placeholder="이메일을 입력하세요"> <br>
    
    <h4>type="color"는 색상을 선택할수 있는 타입</h4>
    <input type="color" name="bgocolor"> <br>
    
    <h4>type="range"는 슬라이드 형태로 색,음량,밝기 등 조절</h4>
    <input type="range" name="slide"> <br>

    <h4>type="date"는 날짜 선택</h4>
    <input type="date" name="select_date"> <br>

    <h4>type="time"는 시간 선택</h4>
    <input type="time" name="nowTime"><br>


    <button>등록</button>
</form> 
    
</body>
</html>
